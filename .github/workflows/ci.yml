name: CI

on:
  pull_request:
    paths:
      - ".github/**"
      - "docs/assets/*.js"
      - "docs/data/**"
      - "docs/index.html"
      - "docs/progress.html"
      - "docs/VOLUNTEER_GUIDE.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: pip install pytest

      - name: Run milestone script tests
        run: pytest .github/scripts/ -v

  test-progress-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run progress dashboard tests
        run: node --test .github/scripts/test_progress_snapshot_js.js

      - name: Check homepage script syntax
        run: node --check docs/assets/site.js

      - name: Run milestone logic tests
        run: node --test .github/scripts/test_milestone_logic.js
