name: Secret Audit (gitleaks)

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: Public GitHub repository URL to scan
        required: true
        type: string

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out curriculum repo
        uses: actions/checkout@v4

      - name: Validate repository URL
        id: repo
        uses: actions/github-script@v7
        env:
          REPO_URL: ${{ inputs.repo_url }}
        with:
          script: |
            const policy = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/milestone_logic.js`);
            const url = policy.extractRepoUrl(process.env.REPO_URL);
            if (!url) {
              core.setFailed('Enter a github.com repository URL, for example https://github.com/user/repo.');
              return;
            }
            core.setOutput('repo_url', url);

      - name: Clone target repository
        env:
          REPO_URL: ${{ steps.repo.outputs.repo_url }}
        run: git clone --depth 1 "$REPO_URL" target-repo

      - name: Install gitleaks
        run: |
          ASSET="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ASSET}" -o "$ASSET"
          echo "${GITLEAKS_SHA256}  ${ASSET}" | sha256sum --check --status
          tar -xzf "$ASSET" gitleaks
          ./gitleaks version

      - name: Scan target repository
        run: |
          ./gitleaks detect \
            --source target-repo \
            --no-git \
            --redact \
            --report-format json \
            --report-path gitleaks.json \
            --exit-code 0

      - name: Publish findings
        if: always()
        run: |
          {
            echo "## gitleaks secret audit"
            echo
            echo "Repository: \`${{ steps.repo.outputs.repo_url }}\`"
            echo
            echo "> Advisory scan only. This workflow does not change milestone labels or status."
            echo
            python .github/scripts/gitleaks_summary.py gitleaks.json
          } >> "$GITHUB_STEP_SUMMARY"
