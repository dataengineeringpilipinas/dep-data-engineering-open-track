name: Notify Reviewer on Discord

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: read

jobs:
  notify:
    if: >-
      github.event.label.name == 'ready-for-review' &&
      contains(github.event.issue.labels.*.name, 'milestone-submission')
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification for enrolled builders
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          script: |
            if (!process.env.DISCORD_WEBHOOK_URL) return;
            const issue = context.payload.issue;

            const enrolledRes = await fetch(
              `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/main/.github/enrolled-participants.json`
            );
            const enrolledData = await enrolledRes.json();
            const enrolled = new Set((enrolledData.participants || []).map(l => l.toLowerCase()));
            if (!enrolled.has(issue.user.login.toLowerCase())) return;

            const body = issue.body || '';
            // Regex mirrors extract_field() in .github/scripts/milestone_policy.py — keep in sync.
            const extract = heading =>
              body.match(new RegExp(`###\\s+${heading}\\s*\\n+([^\\n#]+)`, 'i'))?.[1]?.trim() || '—';
            const milestone = issue.labels.map(l => l.name).find(n => /^M[0-6]$/.test(n)) || '—';

            await fetch(process.env.DISCORD_WEBHOOK_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ embeds: [{
                title: `📬 Submission Ready for Review — ${milestone}`,
                color: 0x1D76DB,
                fields: [
                  { name: 'Builder',   value: extract('Builder Name'),   inline: true },
                  { name: 'Cohort',    value: extract('Cohort'),         inline: true },
                  { name: 'Milestone', value: milestone,                 inline: true },
                  { name: 'Commit',    value: `\`${extract('Commit Hash').slice(0, 7)}\``, inline: true },
                  { name: 'Issue',     value: issue.html_url,            inline: false }
                ],
                footer: { text: 'Automated checks and prerequisite gate passed' },
                timestamp: new Date().toISOString()
              }] })
            });
