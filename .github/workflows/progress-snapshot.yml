name: Progress Snapshot

# Publishes progress-snapshot.json to the unprotected `progress-data` branch so
# the Pages dashboard can render without hitting api.github.com from the
# visitor's browser (60 req/hr/IP unauthenticated). Keeping the snapshot off
# `main` means the bot never needs to bypass branch protection or open a PR on
# every run. The dashboard falls back to the live API when the snapshot is
# missing.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: progress-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch milestone submission issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/issues?labels=milestone-submission&state=all&per_page=100" \
            --jq '[.[] | {number, title, html_url, created_at, updated_at, closed_at, body,
                          user: {login: .user.login},
                          labels: [.labels[] | {name}],
                          pull_request: (has("pull_request"))}]' \
            | jq -s 'add // []' > new-issues.json

      - name: Fetch existing snapshot from the data branch
        run: |
          if git fetch --depth=1 origin progress-data 2>/dev/null && \
             git show origin/progress-data:progress-snapshot.json > existing.json; then
            echo "Loaded the existing snapshot."
          else
            echo '{}' > existing.json
          fi

      - name: Build snapshot
        id: build
        run: |
          result="$(python3 .github/scripts/progress_snapshot.py \
            --issues new-issues.json \
            --existing existing.json \
            --output progress-snapshot.json)"
          echo "$result"
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Publish snapshot to the data branch
        if: steps.build.outputs.result == 'changed'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git show-ref --verify --quiet refs/remotes/origin/progress-data; then
            git worktree add --detach "$RUNNER_TEMP/progress-data" origin/progress-data
          else
            git worktree add --detach "$RUNNER_TEMP/progress-data" HEAD
            cd "$RUNNER_TEMP/progress-data"
            git checkout --orphan progress-data
            git rm -rf .
          fi

          cp "$GITHUB_WORKSPACE/progress-snapshot.json" "$RUNNER_TEMP/progress-data/progress-snapshot.json"
          cd "$RUNNER_TEMP/progress-data"
          git add progress-snapshot.json
          git commit -m "chore(data): update progress snapshot [skip ci]"
          git push origin HEAD:progress-data
